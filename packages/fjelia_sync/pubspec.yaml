name: fjelia_sync
description: Nearby sync between an athlete's Fjelia devices, shared by the mobile and desktop apps.
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # 5.7: pointycastle 3, which the app's encrypt package still needs.
  basic_utils: ">=5.7.0 <5.8.0"
  crypto: ^3.0.6
  # The identity cryptography (lib/src/identity) uses its primitives
  # directly; basic_utils 5.7 brings version 3.
  pointycastle: ^3.9.1
  drift: ^2.35.2
  fjelia_core:
    path: ../fjelia_core
  fjelia_data:
    path: ../fjelia_data

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
