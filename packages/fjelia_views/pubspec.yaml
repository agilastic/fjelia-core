name: fjelia_views
description: What each Fjelia screen shows, read from the database and computed with fjelia_core. The mobile and desktop apps render it.
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.2
  fjelia_core:
    path: ../fjelia_core
  fjelia_data:
    path: ../fjelia_data
  intl: ^0.20.2
  pdf: ^3.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# Noto Sans (SIL Open Font License 1.1, fonts/OFL.txt) for the crew card
# PDF: the PDF's built-in fonts cannot write every letter of the app's
# languages. Both apps load it from here.
flutter:
  assets:
    - fonts/
